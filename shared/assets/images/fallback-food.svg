<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F3"/>
      <stop offset="50%" stop-color="#FFE4E8"/>
      <stop offset="100%" stop-color="#FED7E2"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <circle cx="300" cy="180" r="90" fill="#ffffff" opacity="0.8" filter="url(#softGlow)"/>
  
  <!-- Cute Cloche / Food Dome -->
  <g transform="translate(230, 110)" fill="#E11D48">
    <path d="M70 20 C65 20 62 17 62 12 C62 7 65 4 70 4 C75 4 78 7 78 12 C78 17 75 20 70 20 Z" />
    <path d="M10 90 Q 70 15 130 90 Z" opacity="0.9" />
    <rect x="5" y="92" width="130" height="10" rx="5" fill="#BE123C"/>
    <!-- Steam swirls -->
    <path d="M50 0 Q 55 -15 60 0" stroke="#FB7185" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M70 -5 Q 75 -20 80 -5" stroke="#FB7185" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>
    <path d="M90 0 Q 95 -15 100 0" stroke="#FB7185" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
  </g>
  
  <!-- Text Label -->
  <text x="300" y="270" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="20" font-weight="700" fill="#881337" text-anchor="middle" letter-spacing="1">
    PEACHY PLATE
  </text>
  <text x="300" y="296" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="13" font-weight="600" fill="#9F1239" text-anchor="middle" opacity="0.8" letter-spacing="0.5">
    GOOD FOOD &bull; CUTE MOODS
  </text>
  <text x="300" y="325" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#BE123C" text-anchor="middle" opacity="0.7">
    Fresh Kitchen Creation
  </text>
</svg>
